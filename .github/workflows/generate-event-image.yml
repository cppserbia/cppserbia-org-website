name: Generate Event Image

on:
  pull_request:
    paths:
      - "events/**.md"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    # Fork PRs cannot use GITHUB_TOKEN to push back; gate to same-repo PRs.
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if HEAD is the banner-bot commit
        id: bot-check
        run: |
          set -euo pipefail
          MSG=$(git log -1 --format='%s')
          AUTHOR=$(git log -1 --format='%an')
          if [ "$AUTHOR" = "cppserbia-bot" ] || [[ "$MSG" == chore\(banner\):* ]]; then
            echo "HEAD commit was made by the banner bot; nothing to regenerate."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Decide whether there is anything to do BEFORE paying for the toolchain. The
      # `paths:` filter above matches any PR touching events/**.md, including ones that
      # only edit existing files, so most triggers end here — after ~10s, not after two
      # minutes of Node, pnpm install and Inkscape. Needs only `gh`, preinstalled on the
      # runner.
      - name: Find event file
        if: steps.bot-check.outputs.skip != 'true'
        id: find-event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PR_NUMBER=${{ github.event.pull_request.number }}

          # Only *added* files: editing an existing event (a youtube link, a typo) or
          # touching many at once in a refactor is not a request for a new banner.
          EVENT_FILE=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate \
            --jq '.[] | select(.status == "added") | .filename' \
            | grep '^events/.*\.md$' | grep -v '^events/_' || true)

          if [ -z "$EVENT_FILE" ]; then
            echo "No event files added in this PR (only edits, template or non-event paths)."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          FILE_COUNT=$(echo "$EVENT_FILE" | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" -ne 1 ]; then
            # This job generates one event's banners per run. A multi-event PR is unusual
            # rather than wrong, so skip it — a red check on such a PR is only noise.
            echo "::warning::Found $FILE_COUNT added event files; this workflow handles one per PR. Skipping banner generation — run scripts/generate-event-banner.ts locally, or split the PR."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Found event file: $EVENT_FILE"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "file=$EVENT_FILE" >> "$GITHUB_OUTPUT"

      # `found` is empty when the bot-check skipped find-event, so these stay skipped too.
      - name: Install pnpm
        if: steps.find-event.outputs.found == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: steps.find-event.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        if: steps.find-event.outputs.found == 'true'
        run: pnpm install --frozen-lockfile

      - name: Install Inkscape
        if: steps.find-event.outputs.found == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends inkscape
          inkscape --version

      - name: Cache banner templates
        if: steps.find-event.outputs.found == 'true'
        uses: actions/cache@v4
        with:
          path: scripts/banner/.template-cache
          key: banner-templates-${{ hashFiles('scripts/banner/templates.manifest.json') }}

      - name: Generate banners
        if: steps.find-event.outputs.found == 'true'
        run: npx tsx scripts/generate-event-banner.ts "${{ steps.find-event.outputs.file }}"

      - name: Upload banners to R2 + patch frontmatter
        if: steps.find-event.outputs.found == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: npx tsx scripts/upload-event-banners.ts "${{ steps.find-event.outputs.file }}"

      - name: Commit imageUrl back to PR
        id: commit
        if: steps.find-event.outputs.found == 'true'
        env:
          FILE: ${{ steps.find-event.outputs.file }}
        run: |
          set -euo pipefail
          if git diff --quiet -- "$FILE"; then
            echo "No frontmatter changes (imageUrl already up to date). Skipping commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "cppserbia-bot"
          git config user.email "bot@cppserbia.org"
          git add "$FILE"
          git commit -m "chore(banner): generate and upload event banners"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Comment on PR with previews
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        env:
          FILE: ${{ steps.find-event.outputs.file }}
        with:
          script: |
            const path = require('path');
            const slug = path.basename(process.env.FILE, '.md');
            const base = 'https://images.cppserbia.org/events';
            const horizontal = `${base}/${slug}.jpg`;
            const v34 = `${base}/${slug}-3-4.jpg`;
            const v916 = `${base}/${slug}-9-16.jpg`;

            const body = [
              '🖼️ Event banners generated and uploaded:',
              '',
              `- Horizontal (1920×1080): ${horizontal}`,
              `- Vertical 3:4 (1440×1920): ${v34}`,
              `- Vertical 9:16 (1080×1920): ${v916}`,
              '',
              `<img src="${horizontal}" width="640" alt="horizontal preview"/>`,
              '',
              'Re-push edits to the event file to regenerate.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });

      - name: Comment on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `❌ Failed to generate event banners. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            });
